name=SKLOta
version=1.0.0
author=Martin Abbott <mabbott2011@gmail.com>
maintainer=Martin Abbott <mabbott2011@gmail.com>
sentence=Signed, rollback-safe OTA firmware updates for ESP32 (ECDSA P-256 + SHA-256, A/B slots, self-test before commit).
paragraph=Checks a JSON manifest, installs only a newer build signed by your offline key, streams it into the other app slot, verifies its SHA-256, and rolls back automatically if the new build fails your self-test.
category=Communication
url=https://github.com/mabbott2011/SKL-OTA
architectures=esp32
depends=ArduinoJson
