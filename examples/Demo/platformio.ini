; SKL-OTA demo: one sketch, four builds. `python demo.py` drives these for
; you, or run them yourself from this folder:
;   pio run -e build1 -t upload -t monitor     flash the starting build over USB
;   pio run -e build2                          build an update (demo.py release 2 also signs it)

[platformio]
src_dir = .
default_envs = build1

[env]
platform = espressif32@^6
board = esp32dev            ; default partition table has the two app slots OTA needs
framework = arduino
monitor_speed = 115200
; The sketch lives in this folder, next to .pio/. Compile only the .cpp that
; PlatformIO generates from Demo.ino here, never anything under .pio/.
build_src_filter = +<*.cpp>
lib_deps =
    SKLOta=symlink://../..
    bblanchon/ArduinoJson@^7

[env:build1]
build_flags = -DBUILD=1 -DBREAK_MODE=0

[env:build2]
build_flags = -DBUILD=2 -DBREAK_MODE=0

[env:build3]
build_flags = -DBUILD=3 -DBREAK_MODE=1

[env:build4]
build_flags = -DBUILD=4 -DBREAK_MODE=2
